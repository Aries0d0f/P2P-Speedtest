$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://sws.aries0d0f.me/schemas/p2p-speedtest-result.v1.schema.yaml"
title: P2PSpeedtestResult
description: One peer's stored copy of a P2P speedtest result.
type: object
additionalProperties: false
required:
  - apiVersion
  - kind
  - metadata
  - data
properties:
  apiVersion:
    type: string
    const: "sws.aries0d0f.me/v1"
  kind:
    type: string
    const: "P2PSpeedtestResult"
  metadata:
    $ref: "#/$defs/metadata"
  data:
    $ref: "#/$defs/data"

$defs:
  roomId:
    type: string
    description: >-
      Room ID: a 9-character Crockford base32 slug encoding the room's 42-bit token.
    pattern: "^[0-9ABCDEFGHJKMNPQRSTVWXYZ]{9}$"

  peerId:
    type: string
    format: uuid
    description: UUIDv5 identifying one peer within a room.
    pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-5[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"

  hash:
    type: string
    description: SHA-256 hex digest of the canonical serialization of `data`.
    pattern: "^[0-9a-f]{64}$"

  ipAddress:
    type: string
    description: >-
      A peer's IP, either in full or masked when privacy mode requires it
      (IPv4 `104.xxx.xxx.235`, IPv6 `2001::xxxx:3965`).
    anyOf:
      - format: ipv4
      - format: ipv6
      - pattern: "^[0-9]{1,3}\\.xxx\\.xxx\\.[0-9]{1,3}$"
      - pattern: "^[0-9a-f]{1,4}::xxxx:[0-9a-f]{1,4}$"

  geo:
    type: object
    additionalProperties: false
    description: >-
      Optional geolocation for a peer's IP. All fields optional; a partial
      or failed lookup simply omits the unknown fields.
    properties:
      continent:
        type: string
      continentCode:
        type: string
      country:
        type: string
      countryCode:
        type: string
      region:
        type: string
      regionName:
        type: string
      city:
        type: string
      district:
        type: string
      zip:
        type: string
      lat:
        type: number
        minimum: -90
        maximum: 90
      lon:
        type: number
        minimum: -180
        maximum: 180
      timezone:
        type: string
      offset:
        type: integer
        description: UTC offset in seconds
      isp:
        type: string
      org:
        type: string
      as:
        type: string
      asname:
        type: string
      mobile:
        type: boolean
      proxy:
        type: boolean
      hosting:
        type: boolean

  peer:
    type: object
    additionalProperties: false
    required:
      - id
      - name
    description: >-
      One peer connected to the room, as that peer described itself. `ua`
      and `geo` are omitted, and `ip` is masked, when its privacy mode
      withholds them; `ip`/`protocol` are omitted when it never determined
      its own address.
    properties:
      id:
        $ref: "#/$defs/peerId"
      name:
        type: string
        description: Human-readable name for this peer, as provided by the client.
      ua:
        type: string
        description: User agent string for this peer, as provided by the client.
      ip:
        $ref: "#/$defs/ipAddress"
      protocol:
        type: string
        enum:
          - IPv4
          - IPv6
      geo:
        $ref: "#/$defs/geo"

  bandwidthEdge:
    type: object
    additionalProperties: false
    required:
      - from
      - to
      - speed
      - latency
      - jitter
      - loss
    description: Measured throughput and latency in one direction, between two peers.
    properties:
      from:
        $ref: "#/$defs/peerId"
      to:
        $ref: "#/$defs/peerId"
      speed:
        type: number
        minimum: 0
        description: Throughput from `from` to `to`, in bits per second.
      latency:
        type: number
        minimum: 0
        description: Latency in milliseconds.
      jitter:
        type: number
        minimum: 0
        description: Jitter in milliseconds.
      loss:
        type: number
        format: float
        minimum: 0
        maximum: 1
        description: Fraction of chunks the receiver never saw, 0-1.

  metadata:
    type: object
    additionalProperties: false
    required:
      - id
      - "peer-id"
      - hash
    properties:
      id:
        $ref: "#/$defs/roomId"
        description: Room ID this result belongs to.
      peer-id:
        $ref: "#/$defs/peerId"
        description: This record's own peer ID.
      hash:
        $ref: "#/$defs/hash"

  data:
    type: object
    additionalProperties: false
    required:
      - room
      - status
      - timestamp
      - peers
      - bandwidth
      - via
    description: >-
      Result of the test. There are always two peer entries once measurement
      begins. When `status` is SUCCEED there are also two edges in each
      bandwidth group; otherwise either group may be shorter or absent.
    properties:
      room:
        $ref: "#/$defs/roomId"
      status:
        type: string
        enum:
          - SUCCEED
          - FAILED
          - CANCELED
        description: Outcome of the test.
      timestamp:
        type: string
        format: date-time
        description: >-
          Canonical ISO 8601 run timestamp, authored by slot 0 and shared
          before measurement begins. This is not a completion timestamp.
      peers:
        type: array
        minItems: 2
        maxItems: 2
        items:
          $ref: "#/$defs/peer"
      bandwidth:
        type: object
        additionalProperties: false
        properties:
          directional:
            type: array
            maxItems: 2
            description: One edge per direction, measured one direction at a time.
            items:
              $ref: "#/$defs/bandwidthEdge"
          duplex:
            type: array
            maxItems: 2
            description: One edge per direction, measured with both running at once.
            items:
              $ref: "#/$defs/bandwidthEdge"
      via:
        type: string
        enum:
          - DIRECT
          - RELAY
          - UNKNOWN
        description: >-
          DIRECT for a peer-to-peer connection, RELAY if TURN was used,
          UNKNOWN if never determined.
    if:
      properties:
        status:
          const: SUCCEED
    then:
      properties:
        bandwidth:
          type: object
          required:
            - directional
            - duplex
          properties:
            directional:
              minItems: 2
            duplex:
              minItems: 2
        via:
          not:
            const: UNKNOWN
